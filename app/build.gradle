plugins { id 'com.android.application' }

android { namespace 'com.jarvis.mobile'; compileSdk 35; buildToolsVersion '36.0.0'
    defaultConfig { applicationId 'com.izrealyte.jarvismobile'; minSdk 26; targetSdk 35; versionCode 3; versionName '3.0.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    buildTypes { debug { minifyEnabled false }; release { minifyEnabled false } }
    lint { abortOnError false; checkReleaseBuilds false }
    packagingOptions { resources.excludes += ['META-INF/*', 'kotlin/*'] }
}

